<!doctype html>
<html lang="en">
  <head>
    <!-- Theme — applied before first paint to avoid a flash of the wrong
         theme. Defaults to dark (the site's original look) unless the
         visitor has explicitly chosen light before. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored ? stored === "dark" : true) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags — title, description, keywords, canonical, and
         Open Graph/Twitter tags are NOT duplicated here: Home.jsx renders
         its own copies (React 19's built-in <title>/<meta>/<link> hoisting),
         and the build's prerender step (scripts/prerender.js) bakes those
         into the shipped HTML. A second static copy here previously left
         every one of these tags duplicated in the final markup. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="author" content="Waqas Zafar" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon-image.png" />
    <link rel="apple-touch-icon" href="/icon-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#050303" />
    <meta name="msapplication-TileColor" content="#050303" />

    <!-- Open Graph / Twitter fields Home.jsx doesn't set -->
    <meta property="og:image:alt" content="Waqas Zafar Portfolio Preview" />
    <meta property="og:site_name" content="Waqas Zafar Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:image:alt" content="Waqas Zafar Portfolio Preview" />
    <meta name="twitter:creator" content="@waqaszafar" />

    <!-- Additional SEO Meta Tags -->
    <meta name="rating" content="General" />
    <meta name="distribution" content="global" />
    <meta name="coverage" content="Worldwide" />

    <!-- Structured Data for Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Waqas Zafar",
        "url": "https://waqaszafar.tech",
        "jobTitle": "Software Engineer",
        "description": "Software Engineer specializing in web and mobile applications",
        "sameAs": [
          "https://github.com/WaqasZafar9",
          "https://www.linkedin.com/in/m-waqas-zafar",
          "https://twitter.com/waqaszafar"
        ],
        "knowsAbout": [
          "Software Development",
          "Web Development",
          "Mobile Development",
          "React",
          "Node.js",
          "JavaScript",
          "Frontend Development",
          "Backend Development",
          "Editing",
          "Content Creation",
          "Videography",
          "Photography"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
